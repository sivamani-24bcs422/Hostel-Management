name: hostelhub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hostelhub:latest
    # Uses the same MongoDB URL and JWT secret as local development.
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Optional local database. Start it only if backend/.env points to it:
  #   docker compose --profile local-db up --build -d
  # and set MONGO_URI=mongodb://mongo:27017/hostel_management in backend/.env
  mongo:
    image: mongo:7
    profiles: ["local-db"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
